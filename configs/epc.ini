; Example config for deephe3-epc.py (Cartesian AO electron-phonon coupling).
; Any key not set here falls back to maceh/default_configs/epc_default.ini,
; which documents every option.

[basic]

device = cpu
dtype = double
trained_model_dir = /path/to/trained_model
output_dir = ./epc_output

[data]

; cutoff radius (Angstrom) for the displacement-supercell graph; must be > 0
; and should match the hopping range of the DFT data the model was trained on
radius = 7.2

[epc]

; folder with lat.dat, element.dat, site_positions.dat of ONE structure
structure_dir = /path/to/processed_structure
; uniform q-grid (also fixes the displacement supercell) and k-grid
q_grid = 2 2 2
k_grid = 4 4 4
; finite-difference displacement step (Angstrom)
delta = 0.01
